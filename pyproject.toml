# pyproject.toml

[project]
name = "PyIBS"
dynamic = ["version"]  # use git tags for version, via setuptools_scm
description = "Inverse Binomial Sampling in Python."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "numpy >= 2.0.0",
    "scipy >= 1.13.0",
]
requires-python = ">=3.10"

[project.urls]
Documentation = "https://acerbilab.github.io/pyibs/"
Source = "https://github.com/acerbilab/pyibs"
Changelog = "https://github.com/acerbilab/pyibs/blob/main/CHANGELOG.md"
Issues = "https://github.com/acerbilab/pyibs/issues"
"Model-fitting tools" = "https://acerbilab.org/model-fitting/"

[tool.setuptools]
include-package-data = true
# Every directory of the package; the examples are installed as
# pyibs.examples
packages = [
    "pyibs",
    "pyibs.examples",
    "pyibs.testing",
    "pyibs.testing.integration",
]
package-dir = {"pyibs.examples" = "examples"}

[tool.setuptools.package-data]
# The catalogue of differences from ibslike.m, and the example notebooks
"pyibs" = ["README.md"]
"pyibs.examples" = ["*.ipynb"]

[project.optional-dependencies]
# What the test suite needs (`pytest --pyargs pyibs`); CI installs it.
test = [
    "pytest >= 6.2.5",
]
dev = [
    "build >= 0.9.0",
    "myst_nb >= 0.13.1",
    "numpydoc >= 1.2.1",
    "pre-commit",
    "pytest >= 6.2.5",
    "pytest-cov >= 4.0.0",
    "sphinx >= 4.3.2",
    # Source links in docsrc/source/conf.py use the theme's header buttons.
    "sphinx-book-theme >= 1.0.0",
]

[build-system]
requires = [
    "setuptools >= 77",
    "setuptools_scm[toml] >= 6.2",
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 79

[tool.isort]
skip_glob = []
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
profile = "black"

[tool.pycln]
all = true

[tool.pytest.ini_options]
testpaths = ["pyibs/testing"]
markers = ["integration: runs PyBADS or PyVBMC"]
addopts = "-m 'not integration'"

[tool.setuptools_scm]
write_to = "pyibs/_version.py"
