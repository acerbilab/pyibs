# From https://github.com/eeholmes/readthedoc-test/blob/main/.github/workflows/docs_pages.yml
name: docs

# Rebuilds the documentation on every push to main and commits it to the
# branch gh-pages, which GitHub Pages serves. gh-pages keeps its own empty
# .nojekyll at its root: `cp -R ../main/docs/*` skips dotfiles, and without
# it GitHub Pages drops _static/ and serves the site unstyled.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  build_docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          path: main

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          path: gh-pages
          ref: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd ./main
          python -m pip install .[dev]
      - name: Make the Sphinx docs
        run: |
          cd ./main/docsrc
          make clean
          make github
      - name: Commit changes to docs
        run: |
          cd ./gh-pages
          cp -R ../main/docs/* ./
          git config --local user.email ""
          git config --local user.name "github-actions"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "auto: Rebuild docs."
            git  push
          else
            echo No commit made because the docs have not changed.
          fi
